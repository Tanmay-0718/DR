<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Chakshuh data flow diagram</title>
  <desc id="desc">Light-theme data flow diagram for the Chakshuh diabetic retinopathy screening system.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#486581"/></marker>
    <style>
      .bg{fill:#f8fbff}.title{font:700 32px Arial,sans-serif;fill:#102a43}.sub{font:16px Arial,sans-serif;fill:#486581}.h{font:700 18px Arial,sans-serif;fill:#102a43}.t{font:15px Arial,sans-serif;fill:#243b53}.small{font:13px Arial,sans-serif;fill:#486581}.proc{fill:#e9f5ff;stroke:#3182ce;stroke-width:2}.store{fill:#f1f8f5;stroke:#2f855a;stroke-width:2}.actor{fill:#fff7e6;stroke:#d69e2e;stroke-width:2}.cloud{fill:#f4efff;stroke:#805ad5;stroke-width:2}.line{stroke:#486581;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:7 6}.label{fill:#fff;stroke:#d9e2ec;stroke-width:1}.num{fill:#3182ce}.white{font:700 15px Arial,sans-serif;fill:#fff}
    </style>
  </defs>
  <rect class="bg" width="1600" height="1040"/>
  <text x="800" y="54" text-anchor="middle" class="title">Chakshuh — Data Flow Diagram</text>
  <text x="800" y="82" text-anchor="middle" class="sub">Offline-first diabetic retinopathy screening with optional telemedicine handoff</text>

  <rect x="55" y="185" width="190" height="105" rx="16" class="actor"/><text x="150" y="223" text-anchor="middle" class="h">PHC operator</text><text x="150" y="249" text-anchor="middle" class="t">Patient details</text><text x="150" y="271" text-anchor="middle" class="t">Fundus capture / upload</text>
  <rect x="55" y="500" width="190" height="105" rx="16" class="actor"/><text x="150" y="538" text-anchor="middle" class="h">Ophthalmologist</text><text x="150" y="564" text-anchor="middle" class="t">Reviews referrals</text><text x="150" y="586" text-anchor="middle" class="t">Confirms next action</text>

  <rect x="310" y="150" width="260" height="150" rx="16" class="proc"/><circle cx="340" cy="181" r="16" class="num"/><text x="340" y="187" text-anchor="middle" class="white">1</text><text x="440" y="191" text-anchor="middle" class="h">Clinical intake</text><text x="440" y="220" text-anchor="middle" class="t">Patient + eye selection</text><text x="440" y="244" text-anchor="middle" class="t">Fundus image acquisition</text><text x="440" y="268" text-anchor="middle" class="small">React clinical workflow</text>
  <rect x="310" y="415" width="260" height="170" rx="16" class="proc"/><circle cx="340" cy="447" r="16" class="num"/><text x="340" y="453" text-anchor="middle" class="white">2</text><text x="440" y="456" text-anchor="middle" class="h">Edge quality gate</text><text x="440" y="484" text-anchor="middle" class="t">Fundus validity + IQA</text><text x="440" y="508" text-anchor="middle" class="t">Blur • illumination • FOV</text><text x="440" y="539" text-anchor="middle" class="small">Ungradable → recapture request</text><text x="440" y="561" text-anchor="middle" class="small">Gradable → preprocess image</text>
  <rect x="650" y="150" width="290" height="150" rx="16" class="proc"/><circle cx="680" cy="181" r="16" class="num"/><text x="680" y="187" text-anchor="middle" class="white">3</text><text x="795" y="191" text-anchor="middle" class="h">Clinical AI analysis</text><text x="795" y="220" text-anchor="middle" class="t">Anatomy &amp; lesion segmentation</text><text x="795" y="244" text-anchor="middle" class="t">18 biomarkers + ETDRS 4-2-1</text><text x="795" y="268" text-anchor="middle" class="small">Fusion grading: ICDR 0–4</text>
  <rect x="650" y="415" width="290" height="170" rx="16" class="proc"/><circle cx="680" cy="447" r="16" class="num"/><text x="680" y="453" text-anchor="middle" class="white">4</text><text x="795" y="456" text-anchor="middle" class="h">Explain &amp; package result</text><text x="795" y="484" text-anchor="middle" class="t">Confidence calibration + DME risk</text><text x="795" y="508" text-anchor="middle" class="t">Grad-CAM / lesion overlay</text><text x="795" y="539" text-anchor="middle" class="small">Clinical result + 3.2 KB telemetry</text><text x="795" y="561" text-anchor="middle" class="small">Referral priority</text>

  <rect x="1030" y="130" width="245" height="125" rx="16" class="store"/><text x="1152" y="169" text-anchor="middle" class="h">Local patient registry</text><text x="1152" y="197" text-anchor="middle" class="t">Screening records</text><text x="1152" y="221" text-anchor="middle" class="small">Browser local storage</text>
  <rect x="1030" y="350" width="245" height="150" rx="16" class="cloud"/><circle cx="1060" cy="382" r="16" fill="#805ad5"/><text x="1060" y="388" text-anchor="middle" class="white">5</text><text x="1152" y="391" text-anchor="middle" class="h">Cloud / EHR gateway</text><text x="1152" y="419" text-anchor="middle" class="t">REST or FHIR R4 export</text><text x="1152" y="443" text-anchor="middle" class="t">Sync or offline buffer</text><text x="1152" y="469" text-anchor="middle" class="small">Optional enterprise endpoint</text>
  <rect x="1030" y="620" width="245" height="145" rx="16" class="cloud"/><text x="1152" y="659" text-anchor="middle" class="h">District triage hub</text><text x="1152" y="687" text-anchor="middle" class="t">Referable-case queue</text><text x="1152" y="711" text-anchor="middle" class="t">Specialist review</text><text x="1152" y="737" text-anchor="middle" class="small">SimEvents operational model</text>

  <path d="M245 237 H310" class="line"/><rect x="252" y="202" width="104" height="22" rx="6" class="label"/><text x="304" y="218" text-anchor="middle" class="small">image + intake</text>
  <path d="M440 300 V415" class="line"/><rect x="450" y="337" width="115" height="22" rx="6" class="label"/><text x="507" y="353" text-anchor="middle" class="small">image / metadata</text>
  <path d="M570 500 H650" class="line"/><rect x="576" y="468" width="96" height="22" rx="6" class="label"/><text x="624" y="484" text-anchor="middle" class="small">approved image</text>
  <path d="M570 455 C620 430,615 270,650 250" class="line dash"/><text x="592" y="325" class="small">quality pass</text>
  <path d="M795 300 V415" class="line"/><rect x="804" y="337" width="130" height="22" rx="6" class="label"/><text x="869" y="353" text-anchor="middle" class="small">masks + biomarkers</text>
  <path d="M940 500 H1030" class="line"/><rect x="945" y="468" width="104" height="22" rx="6" class="label"/><text x="997" y="484" text-anchor="middle" class="small">screening result</text>
  <path d="M940 215 H1030" class="line"/><rect x="944" y="181" width="126" height="22" rx="6" class="label"/><text x="1007" y="197" text-anchor="middle" class="small">record &amp; image link</text>
  <path d="M1152 255 V350" class="line"/><rect x="1164" y="290" width="82" height="22" rx="6" class="label"/><text x="1205" y="306" text-anchor="middle" class="small">auto-sync</text>
  <path d="M1152 500 V620" class="line"/><rect x="1162" y="542" width="122" height="22" rx="6" class="label"/><text x="1223" y="558" text-anchor="middle" class="small">referable dossier</text>
  <path d="M1030 692 C850 720,490 705,245 565" class="line"/><rect x="610" y="689" width="148" height="22" rx="6" class="label"/><text x="684" y="705" text-anchor="middle" class="small">triage decision / report</text>
  <path d="M650 550 C565 700,305 720,245 605" class="line dash"/><text x="405" y="687" class="small">immediate on-screen result</text>

  <rect x="1350" y="170" width="190" height="420" rx="18" fill="#fff" stroke="#d9e2ec" stroke-width="1.5"/><text x="1445" y="211" text-anchor="middle" class="h">Data produced</text>
  <text x="1380" y="253" class="t">• Patient / exam details</text><text x="1380" y="286" class="t">• Fundus image</text><text x="1380" y="319" class="t">• IQA outcome</text><text x="1380" y="352" class="t">• Lesion masks</text><text x="1380" y="385" class="t">• 18 biomarkers</text><text x="1380" y="418" class="t">• ICDR grade &amp; confidence</text><text x="1380" y="451" class="t">• DME / referral flags</text><text x="1380" y="484" class="t">• FHIR diagnostic report</text><text x="1380" y="517" class="t">• Network queue metrics</text>
  <text x="800" y="960" text-anchor="middle" class="small">Solid arrows: main clinical data flow  •  Dashed arrows: local feedback / gate outcome  •  Cloud sync is configurable and can buffer offline</text>
</svg>
