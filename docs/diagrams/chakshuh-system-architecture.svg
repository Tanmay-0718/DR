<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Chakshuh system architecture</title><desc id="desc">Light-theme system architecture for the Chakshuh retinal screening platform.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#486581"/></marker><style>.bg{fill:#f8fbff}.title{font:700 32px Arial,sans-serif;fill:#102a43}.sub{font:16px Arial,sans-serif;fill:#486581}.zone{stroke-width:2}.edge{fill:#e9f5ff;stroke:#3182ce}.web{fill:#f1f8f5;stroke:#2f855a}.cloud{fill:#f4efff;stroke:#805ad5}.ops{fill:#fff7e6;stroke:#d69e2e}.h{font:700 19px Arial,sans-serif;fill:#102a43}.t{font:15px Arial,sans-serif;fill:#243b53}.small{font:13px Arial,sans-serif;fill:#486581}.box{fill:#fff;stroke:#bcccdc;stroke-width:1.5}.line{stroke:#486581;stroke-width:2.3;fill:none;marker-end:url(#a)}.dash{stroke-dasharray:7 6}.badge{font:700 13px Arial,sans-serif;fill:#fff}</style></defs>
  <rect class="bg" width="1600" height="1040"/><text x="800" y="54" text-anchor="middle" class="title">Chakshuh — System Architecture</text><text x="800" y="82" text-anchor="middle" class="sub">Clinical edge node, browser application, integration boundary, and operational simulation</text>
  <rect x="40" y="125" width="430" height="760" rx="22" class="zone edge"/><text x="70" y="168" class="h">1. Screening site / edge node</text><text x="70" y="194" class="small">PHC, CHC, mobile screening van — works without an internet connection</text>
  <rect x="75" y="230" width="360" height="96" rx="14" class="box"/><text x="255" y="268" text-anchor="middle" class="h">Fundus camera or file input</text><text x="255" y="294" text-anchor="middle" class="t">Retinal image + patient / eye context</text>
  <rect x="75" y="368" width="360" height="197" rx="14" class="box"/><text x="255" y="404" text-anchor="middle" class="h">MATLAB edge diagnostic pipeline</text><text x="105" y="437" class="t">Gate 0: anatomical fundus validation</text><text x="105" y="464" class="t">Module 1: IQA + CLAHE preprocessing</text><text x="105" y="491" class="t">Module 2: anatomy &amp; lesion segmentation</text><text x="105" y="518" class="t">Module 3: fused ICDR grading</text><text x="105" y="545" class="t">Module 4: XAI, DME &amp; PDF report</text>
  <rect x="75" y="607" width="360" height="115" rx="14" class="box"/><text x="255" y="645" text-anchor="middle" class="h">Edge output</text><text x="255" y="673" text-anchor="middle" class="t">Grade, confidence, lesion evidence</text><text x="255" y="697" text-anchor="middle" class="small">3.2 KB encrypted telemetry packet</text>
  <rect x="75" y="764" width="360" height="78" rx="14" class="box"/><text x="255" y="796" text-anchor="middle" class="h">Target runtime</text><text x="255" y="821" text-anchor="middle" class="t">Jetson Orin Nano • ~186 ms inference</text>

  <rect x="520" y="125" width="515" height="760" rx="22" class="zone web"/><text x="550" y="168" class="h">2. Clinical web application</text><text x="550" y="194" class="small">React + Vite frontend deployed on Vercel or run locally</text>
  <rect x="555" y="230" width="445" height="116" rx="14" class="box"/><text x="778" y="267" text-anchor="middle" class="h">Clinical user experience</text><text x="778" y="295" text-anchor="middle" class="t">Landing • 4-step screening workflow • result review</text><text x="778" y="320" text-anchor="middle" class="t">Overlay viewer • XAI report • patient registry</text>
  <rect x="555" y="388" width="210" height="166" rx="14" class="box"/><text x="660" y="424" text-anchor="middle" class="h">Browser pipeline</text><text x="580" y="456" class="t">IQA simulation</text><text x="580" y="482" class="t">Segmentation simulation</text><text x="580" y="508" class="t">Feature fusion grading</text><text x="580" y="534" class="small">Mirrors Modules 1–4</text>
  <rect x="790" y="388" width="210" height="166" rx="14" class="box"/><text x="895" y="424" text-anchor="middle" class="h">Local persistence</text><text x="815" y="456" class="t">Patient records</text><text x="815" y="482" class="t">Cloud configuration</text><text x="815" y="508" class="t">Pending sync queue</text><text x="815" y="534" class="small">localStorage</text>
  <rect x="555" y="596" width="445" height="111" rx="14" class="box"/><text x="778" y="633" text-anchor="middle" class="h">Restricted developer console</text><text x="778" y="661" text-anchor="middle" class="t">Benchmark dashboard • training simulator • slide deck</text><text x="778" y="685" text-anchor="middle" class="small">Session-gated engineering views</text>
  <rect x="555" y="749" width="445" height="93" rx="14" class="box"/><text x="778" y="786" text-anchor="middle" class="h">Static clinical assets</text><text x="778" y="813" text-anchor="middle" class="t">Sample fundus images • validation spreadsheets</text>

  <rect x="1085" y="125" width="475" height="412" rx="22" class="zone cloud"/><text x="1115" y="168" class="h">3. Optional enterprise integration</text><text x="1115" y="194" class="small">Configurable REST / FHIR boundary; mock mode supported</text>
  <rect x="1120" y="230" width="405" height="92" rx="14" class="box"/><text x="1322" y="266" text-anchor="middle" class="h">Cloud EHR service adapter</text><text x="1322" y="294" text-anchor="middle" class="t">Connection test • save • retry / offline buffer</text>
  <rect x="1120" y="365" width="190" height="120" rx="14" class="box"/><text x="1215" y="402" text-anchor="middle" class="h">REST endpoint</text><text x="1215" y="431" text-anchor="middle" class="t">/patients</text><text x="1215" y="455" text-anchor="middle" class="small">Bearer auth</text>
  <rect x="1335" y="365" width="190" height="120" rx="14" class="box"/><text x="1430" y="402" text-anchor="middle" class="h">FHIR R4 export</text><text x="1430" y="431" text-anchor="middle" class="t">DiagnosticReport</text><text x="1430" y="455" text-anchor="middle" class="small">ABDM-ready schema</text>

  <rect x="1085" y="585" width="475" height="300" rx="22" class="zone ops"/><text x="1115" y="628" class="h">4. Network planning &amp; clinical triage</text><text x="1115" y="654" class="small">MATLAB Simulink / SimEvents digital operational model</text>
  <rect x="1120" y="690" width="190" height="145" rx="14" class="box"/><text x="1215" y="727" text-anchor="middle" class="h">Telemedicine model</text><text x="1145" y="758" class="t">PHC arrivals</text><text x="1145" y="784" class="t">2G/4G link + retries</text><text x="1145" y="810" class="t">Priority routing</text>
  <rect x="1335" y="690" width="190" height="145" rx="14" class="box"/><text x="1430" y="727" text-anchor="middle" class="h">District hub</text><text x="1360" y="758" class="t">Review queues</text><text x="1360" y="784" class="t">Staffing estimate</text><text x="1360" y="810" class="t">Triage outcome</text>

  <path d="M255 326 V368" class="line"/><path d="M255 565 V607" class="line"/><path d="M435 665 H555" class="line"/><text x="485" y="650" text-anchor="middle" class="small">results</text>
  <path d="M765 471 H790" class="line"/><path d="M778 346 V388" class="line"/><path d="M1000 471 H1120" class="line"/><text x="1060" y="456" text-anchor="middle" class="small">sync when enabled</text>
  <path d="M1322 322 V365 H1215" class="line"/><path d="M1322 322 V365 H1430" class="line"/>
  <path d="M1215 485 V690" class="line dash"/><text x="1232" y="584" class="small">referral workload</text><path d="M1310 762 H1335" class="line"/>
  <path d="M1035 800 H1085" class="line dash"/><text x="1060" y="785" text-anchor="middle" class="small">planning inputs</text>
  <text x="800" y="950" text-anchor="middle" class="small">Boundary principle: diagnosis and quality gating run at the screening site; cloud connectivity enriches records and referral coordination but is not required for screening.</text>
</svg>
